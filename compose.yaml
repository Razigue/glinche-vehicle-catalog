x-php: &php
  image: glinche-php
  build:
    context: ./docker/php
    args:
      UID: ${UID:-1000}
      GID: ${GID:-1000}
  volumes:
    - ./backend:/var/www/html

services:
  app:
    <<: *php
    command: start-app
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "test", "-f", "/tmp/ready"]
      interval: 5s
      retries: 60

  scheduler:
    <<: *php
    command: php artisan schedule:work
    depends_on:
      app:
        condition: service_healthy

  nginx:
    image: nginx:1.29-alpine
    ports:
      - "8000:80"
    volumes:
      - ./backend:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy

  mysql:
    image: mysql:9.7
    environment:
      MYSQL_DATABASE: glinche
      MYSQL_USER: glinche
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uglinche", "-psecret"]
      interval: 5s
      retries: 30

  node:
    image: node:24-alpine
    working_dir: /app
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"
    environment:
      API_PROXY_TARGET: http://nginx
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - nginx

volumes:
  mysql-data:
